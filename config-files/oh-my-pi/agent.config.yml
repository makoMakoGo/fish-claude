autolearn:
  enabled: false
skills:
  enabled: true
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: true
  enablePiProject: true
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
mcp:
  enableProjectConfig: true
  enableClaudeUser: false
  enableCodexUser: false
defaultThinkingLevel: xhigh
tier:
  openai: priority
  anthropic: priority
  google: priority
modelRoles:
  default: openai-pro/gpt-5.6-sol:xhigh
  smol: openai-pro/gpt-5.6-terra:max
  slow: openai-pro/gpt-5.6-sol:max
  designer: xai-oauth/grok-4.5:xhigh
  commit: openai-pro/gpt-5.6-sol:xhigh
  vision: openai-pro/gpt-5.6-sol:xhigh
  task: openai-pro/gpt-5.6-sol:xhigh
  plan: openai-pro/gpt-5.6-sol:max
  advisor: openai-pro/gpt-5.6-sol:xhigh
  tiny: openai-pro/gpt-5.6-luna:max
advisor:
  enabled: true
compaction:
  strategy: context-full
async:
  enabled: false
memories:
  enabled: false
task:
  eager: default
  maxConcurrency: 32
  maxRecursionDepth: 2
  isolation:
    mode: none
    merge: patch
    commits: generic
providers:
  webSearch: codex
disabledProviders:
  - claude
  - claude-plugins
  - codex
  - gemini
  - opencode
  - cursor
  - cline
  - windsurf
  - vscode
  - github
  - agents-md
  - mcp-json
  - omp-managed
display:
  showTokenUsage: true
statusLine:
  preset: custom
  separator: ascii
  leftSegments:
    - path
    - git
    - mode
    - model
    - context_pct
    - token_total
  rightSegments: []
  segmentOptions:
    model:
      showThinkingLevel: false
  sessionAccent: true
colorBlindMode: true
memory:
  backend: "off"
theme:
  dark: dark-cyberpunk
symbolPreset: ascii
github:
  enabled: true
extensions:
  - /home/travis/.omp/agent/extensions/swarm-extension-local
dev:
  autoqa:
    consent: granted
setupVersion: 1
lsp:
  enabled: false
hideThinkingBlock: false
retry:
  fallbackChains:
    tiny:
      - xai-oauth/grok-4.5
