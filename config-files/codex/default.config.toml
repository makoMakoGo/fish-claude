model = "gpt-5.5"
model_provider = "openai"
cli_auth_credentials_store = "file"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
plan_mode_reasoning_effort = "high"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true
developer_instructions = "Minimize fault tolerance and avoid fallback mechanisms. No over-designing."
personality = "pragmatic"
web_search = "live"
approvals_reviewer = "auto_review"
approval_policy = "on-request"
model_context_window = 1000000
service_tier = "fast"

[sandbox_workspace_write]
network_access = true

[features]
multi_agent_v2 = true
prevent_idle_sleep = true
goals = true
apply_patch_freeform = true
apply_patch_streaming_events = true
tool_search_always_defer_mcp_tools = true

[agents]
max_depth = 1

[agents.default]
description = "Default agent."
config_file = "agents/default.toml"

[agents.worker]
description = "Use for execution and production work."
config_file = "agents/worker.toml"

[agents.explorer]
description = "Use for specific codebase questions and read-only evidence gathering."
config_file = "agents/explorer.toml"

[agents.spark]
description = "Use for low-context, speed-first, text-only repo reading, targeted evidence gathering, and simple bounded tasks within Spark's 128k context. Avoid broad multi-file exploration or multimodal work."
config_file = "agents/spark.toml"

[agents.awaiter]
description = "Use for long-running wait or poll workflows."
config_file = "agents/awaiter.toml"

[notice]
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.3-codex"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "context-window-size"]
notifications = true
notification_condition = "unfocused"
terminal_title = ["spinner", "project", "model"]
animations = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true