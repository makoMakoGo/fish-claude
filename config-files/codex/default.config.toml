model = "gpt-5.6-sol"
model_provider = "openai"
cli_auth_credentials_store = "file"
model_reasoning_effort = "ultra"
model_reasoning_summary = "detailed"
plan_mode_reasoning_effort = "ultra"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true
developer_instructions = "Minimize fault tolerance and avoid fallback mechanisms. No over-designing."
personality = "friendly"
web_search = "live"
approvals_reviewer = "auto_review"
approval_policy = "on-request"
model_context_window = 1000000
service_tier = "default"

[history]
persistence = "save-all"

[features]
apps = false
browser_use = false
browser_use_external = false
computer_use = false
in_app_browser = false
image_generation = false
multi_agent_v2 = { enabled = true, hide_spawn_agent_metadata = false, tool_namespace = "agents" }
prevent_idle_sleep = true
goals = true
apply_patch_streaming_events = true
tool_search_always_defer_mcp_tools = true
terminal_resize_reflow = true

[agents]
max_depth = 1

[agents.default]
description = "Default agent."
config_file = "agents/default.toml"

[agents.worker]
description = "Use for execution and production work."
config_file = "agents/worker.toml"

[agents.explorer]
description = "Use for specific codebase questions and read-only evidence gathering."
config_file = "agents/explorer.toml"

[agents.spark]
description = "Use for speed-first repository reading, targeted evidence gathering, and simple bounded tasks. Keep the assignment narrow and avoid broad multi-file exploration unless explicitly requested."
config_file = "agents/spark.toml"

[notice]
fast_default_opt_out = true

# [mcp_servers.playwright]
# type = "stdio"
# command = "/mnt/c/Windows/System32/cmd.exe"
# args = ["/c", "npx", "@playwright/mcp@latest"]
# startup_timeout_sec = 30

[notice.model_migrations]
"gpt-5.2" = "gpt-5.3-codex"
"gpt-5.4" = "gpt-5.5"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "used-tokens"]
notifications = true
notification_condition = "unfocused"
terminal_title = ["spinner", "project", "model"]
animations = true
theme = "catppuccin-latte"
status_line_use_colors = true
pet = "custom:yorha-sit-2b"

[plugins."gmail@openai-curated"]
enabled = false

[plugins."github@openai-curated"]
enabled = true

[sandbox_workspace_write]
network_access = true

[[skills.config]]
path = "/home/travis/.codex/skills/.system/imagegen/SKILL.md"
enabled = false

[[skills.config]]
path = "/home/travis/.codex/skills/.system/plugin-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "/home/travis/.codex/skills/.system/skill-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "/home/travis/.codex/skills/.system/skill-installer/SKILL.md"
enabled = false

[[skills.config]]
path = "/home/travis/.codex/skills/.system/openai-docs/SKILL.md"
enabled = false
