name: repo-hygiene

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repo hygiene checks
        run: bash tools/check-repo-hygiene.sh

      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # 外链由每周的 link-check 负责；这里只在 push 时快查仓库内相对链接
          args: >-
            --offline
            --no-progress
            --exclude-path 'system-prompts/'
            "**/*.md"
