name: validate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate.yml
      - AGENTS.md
      - tools/**
      - config-files/droid/statusline.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run lightweight validation
        run: bash tools/validate.sh
